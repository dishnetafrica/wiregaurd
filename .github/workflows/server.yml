name: server

on:
  push:
    paths: ["server/**", ".github/workflows/server.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. v0.1.0 (creates the tag and a GitHub Release with the binary)"
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install nft (for generated-ruleset syntax check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Build release binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dishnet-vpnd ./cmd/dishnet-vpnd
      - uses: actions/upload-artifact@v4
        with:
          name: dishnet-vpnd-linux-amd64
          path: server/dishnet-vpnd

  release:
    # Tag a commit `vX.Y.Z` to publish the binary as a GitHub Release so the
    # hub can download it with a single curl (no CI login needed).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dishnet-vpnd-linux-amd64
      - run: mv dishnet-vpnd dishnet-vpnd-linux-amd64 && sha256sum dishnet-vpnd-linux-amd64 > dishnet-vpnd-linux-amd64.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dishnet-vpnd-linux-amd64
            dishnet-vpnd-linux-amd64.sha256
