{{template "header" .}}
<div class="box">
  <div class="logo">DishNet</div>
  <h1>Sign in to use your office computer</h1>
  <p class="muted">Use the login DishNet gave you. This is not your Windows or Tally password.</p>
  <form method="post" action="/desk/login">
    <label>Login</label><input name="login" value="{{.Login}}" autocomplete="username" autofocus required autocapitalize="none">
    <label>Password</label><input name="password" type="password" autocomplete="current-password" required>
    <button>Sign in</button>
  </form>
  <p class="muted small">Forgot your password? Ask DishNet to reset it; they will give you a temporary one.</p>
</div>
{{template "footer" .}}
