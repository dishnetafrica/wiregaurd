{{template "header" .}}
<div class="box">
  <h1>{{if .First}}Choose your own password{{else}}Change password{{end}}</h1>
  {{if .First}}<p class="muted">The password DishNet gave you was temporary. Choose one only you know (at least 10 characters).</p>{{end}}
  <form method="post" action="/desk/password">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label>Current password</label><input name="current" type="password" autocomplete="current-password" required>
    <label>New password (at least 10 characters)</label><input name="new" type="password" autocomplete="new-password" minlength="10" required>
    <label>New password again</label><input name="again" type="password" autocomplete="new-password" minlength="10" required>
    <button>Save password</button>
  </form>
</div>
{{template "footer" .}}
